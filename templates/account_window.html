{% extends "editor_base.html" %}
{% block title %}Account console{% endblock %}
{% block content %}
<div class="admin_form">
    <b>{{ title }}</b>
    <form name="admin_editor" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if edit %}
        <label for="e_id">ID*</label><input name="e_id" id="e_id" type="text" value="{{ id }}" readonly>
        {% endif %}
        <label for="c_firstname">Firstname*</label><input name="c_firstname" id="c_firstname" type="text" value="{{ f_name }}" required>
        <label for="c_lastname">Lastname*</label><input name="c_lastname" id="c_lastname" type="text" value="{{ l_name }}" required>
        <label for="c_psw">Password*</label><input name="c_psw" id="c_psw" type="password" minlength="10" maxlength="256" autocomplete="new-password" {% if not edit %}required{% endif %}>
        {% if edit %}
        <label for="e_psw">Confirm password*</label><input name="e_psw" id="e_psw" type="password">
        {% endif %}
        <label for="c_roles">Roles*</label><select name="c_roles" id="c_roles" required>
            <option value="0" {% if role_id == 0 %}selected{% endif %}>Admin</option>
            <option value="1" {% if role_id == 1 %}selected{% endif %}>Student</option>
            <option value="2" {% if role_id == 2 %}selected{% endif %}>Instructor</option>
        </select>
        <input name="c_submit" id="account_submit" type="submit" value="Submit">
    </form>
</div>
{% endblock %}
