<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='stylesheets/admin.css') }}">

    <title>Login</title>
</head>
<body>
<header>Learning Management System</header>
<main class="login-card"><h1>Welcome back</h1><p>Sign in to your learning workspace.</p>
<form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div><label for="id">Personal ID</label><input type="text" id="id" name="id" inputmode="numeric" pattern="[0-9]{1,18}" maxlength="18" autocomplete="username" class="non-name" required></div>
    <div><label for="psw">Password</label><input type="password" id="psw" name="psw" autocomplete="current-password" class="non-name" required></div>
    <br>
    <div><input type="submit" id="login" value="Log in" class="login"></div>
</form></main>

</body>
</html>
