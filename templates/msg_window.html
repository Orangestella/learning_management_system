{% extends "editor_base.html" %}
{% block title %}New message{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/recipients.js') }}" defer></script>{% endblock %}
{% block content %}
<div class="admin_form" id="msg_form">
    <b>{{ title }}</b>
    <form name="admin_editor" id="msg_editor" method="post" data-success-url="/messages">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="receiver_id">Recipient ID or name*</label>
        <input type="text" id="receiver_id" name="receiver_id" maxlength="100" autocomplete="off" pattern="[0-9]{1,18}" aria-describedby="recipient-hint recipient-status" aria-controls="recipient-results" required>
        <small id="recipient-hint" class="muted">Enter a personal ID to see the name, or search by name and select a recipient.</small>
        <p id="recipient-status" class="recipient-status" role="status" aria-live="polite"></p>
        <div id="recipient-results" class="recipient-results" aria-label="Matching recipients" hidden></div>
        <label for="con">Message*</label><textarea id="con" name="con" rows="6" maxlength="4096" required></textarea>
        <input name="msg_submit" id="msg_submit" type="submit" value="Send">
    </form>
</div>
{% endblock %}
