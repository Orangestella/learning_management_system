{% extends "editor_base.html" %}
{% block title %}New topic{% endblock %}
{% block content %}
<div class="admin_form" id="stu_pst">
    <b>{{ title }}</b>
    <form name="admin_editor" id="pst_editor" method="post" data-success-url="/forum/view/{{ frm_id }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="frm_id">Forum ID (Read Only)</label><input type="text" id="frm_id" name="frm_id" value="{{ frm_id }}" readonly>
        <label for="content">Topic content*</label><textarea id="content" name="content" rows="8" maxlength="4096" required></textarea>
        <input name="pst_submit" id="pst_submit" type="submit" value="Submit">
    </form>
</div>
{% endblock %}
